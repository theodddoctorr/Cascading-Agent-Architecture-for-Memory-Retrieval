# Security updates are always enabled by default for supported ecosystems
# To enable Dependabot security updates:
# 1. Go to repository Settings
# 2. Click "Code security and analysis"
# 3. Enable "Dependabot security updates"

# Notes:
# - Currently only GitHub Actions dependencies are tracked
# - As code is added to the repository, uncomment the relevant sections above
# - Dependabot will automatically create PRs for outdated dependencies
# - Review and merge PRs to keep dependencies up to date
