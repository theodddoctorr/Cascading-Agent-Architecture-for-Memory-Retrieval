name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  file-integrity:
    name: File Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required files
        run: |
          echo "Checking for required repository files..."

          REQUIRED_FILES=(
            "README.md"
            "LICENSE"
            "LICENSE-CODE"
            "CITATION.cff"
            "CHANGELOG.md"
            "Cascading Agent Architecture for Memory Retrieval.pdf"
            "checksums_with_frontmatter.json"
            ".gitignore"
            ".gitattributes"
          )

          MISSING_FILES=()

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
              echo "❌ Missing: $file"
            else
              echo "✅ Found: $file"
            fi
          done

          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo ""
            echo "Error: Missing required files:"
            printf '%s\n' "${MISSING_FILES[@]}"
            exit 1
          fi

          echo ""
          echo "✅ All required files present"

      - name: Verify file permissions
        run: |
          echo "Checking file permissions..."
          find . -type f ! -path './.git/*' -executable -ls || true
          echo "✅ File permissions checked"

  metadata-validation:
    name: Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          for file in *.json; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              python3 -m json.tool "$file" > /dev/null
              echo "✅ $file is valid JSON"
            fi
          done

  repository-quality:
    name: Repository Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          echo "Checking for large files (>10MB)..."
          LARGE_FILES=$(find . -type f ! -path './.git/*' -size +10M)

          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ Large files found:"
            echo "$LARGE_FILES"
            echo ""
            echo "Consider using Git LFS for files larger than 10MB"

            # Check if any are over 50MB (GitHub's hard limit)
            HUGE_FILES=$(find . -type f ! -path './.git/*' -size +50M)
            if [ -n "$HUGE_FILES" ]; then
              echo "❌ Files over 50MB found (exceeds GitHub limit):"
              echo "$HUGE_FILES"
              exit 1
            fi
          else
            echo "✅ No large files found"
          fi

      - name: Check repository size
        run: |
          REPO_SIZE=$(du -sh . | cut -f1)
          echo "Repository size: $REPO_SIZE"
          echo "✅ Repository size checked"

      - name: Verify git configuration
        run: |
          echo "Checking git configuration..."

          # Check for .gitignore
          if [ -f ".gitignore" ]; then
            echo "✅ .gitignore present"
          else
            echo "❌ .gitignore missing"
            exit 1
          fi

          # Check for .gitattributes
          if [ -f ".gitattributes" ]; then
            echo "✅ .gitattributes present"
          else
            echo "⚠️ .gitattributes missing (recommended)"
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [file-integrity, metadata-validation, repository-quality]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "### CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.file-integrity.result }}" == "success" ]; then
            echo "✅ File Integrity Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ File Integrity Check: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.metadata-validation.result }}" == "success" ]; then
            echo "✅ Metadata Validation: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Metadata Validation: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.repository-quality.result }}" == "success" ]; then
            echo "✅ Repository Quality: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Repository Quality: Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Final status
        run: |
          if [ "${{ needs.file-integrity.result }}" == "success" ] && \
             [ "${{ needs.metadata-validation.result }}" == "success" ] && \
             [ "${{ needs.repository-quality.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
