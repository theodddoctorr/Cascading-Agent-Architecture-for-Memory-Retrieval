name: Spell Check

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '**.txt'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  spell-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Spell check with typos
      uses: crate-ci/typos@master
      with:
        files: |
          *.md
          .github/**/*.md
          *.txt
        config: ./.github/typos.toml

    - name: Report results
      if: always()
      run: |
        echo "### Spell Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ $? -eq 0 ]; then
          echo "✅ No spelling errors found" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Spelling errors detected - see logs for details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To fix false positives, add them to .github/typos.toml" >> $GITHUB_STEP_SUMMARY
        fi
